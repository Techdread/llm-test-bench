<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ribbon -->
  <g filter="url(#shadow)">
    <!-- Blue side -->
    <path d="M70 20 L90 20 L100 130 L80 130 Z" fill="#0047AB" />
    <!-- Red side -->
    <path d="M130 20 L110 20 L100 130 L120 130 Z" fill="#D22B2B" />
    <!-- Ribbon Fold/Top -->
    <path d="M70 20 Q100 10 130 20 L130 30 Q100 20 70 30 Z" fill="#A02020" />
  </g>

  <!-- Medal Coin -->
  <g filter="url(#shadow)">
    <!-- Outer Rim -->
    <circle cx="100" cy="160" r="50" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2" />
    <!-- Inner Circle for detail -->
    <circle cx="100" cy="160" r="42" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4,2" />
    
    <!-- Center Emblem (Star) -->
    <path d="M100 135 L108 152 L125 152 L112 162 L117 179 L100 169 L83 179 L88 162 L75 152 L92 152 Z" fill="#FFFACD" stroke="#B8860B" stroke-width="1" />
    
    <!-- Connection Ring -->
    <circle cx="100" cy="130" r="6" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1" />
  </g>

  <!-- Highlights for shine -->
  <ellipse cx="85" cy="145" rx="10" ry="5" fill="white" fill-opacity="0.3" transform="rotate(-45 85 145)" />
</svg>