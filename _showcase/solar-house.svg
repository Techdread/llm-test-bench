<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">A home powered by sunshine</title>
  <desc id="desc">A warm architectural illustration of a cream house with six blue rooftop solar panels, a garden, and a golden sun that continuously circles the house.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e5efeb"/>
      <stop offset="1" stop-color="#f4f3de"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24546a"/>
      <stop offset="1" stop-color="#122f48"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a2c9c6"/>
      <stop offset="1" stop-color="#5f929b"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0.4" stop-color="#ffce59" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffce59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cells" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#80b8c7" stroke-width="0.8" opacity="0.6"/>
      <path d="M9 0V18" stroke="#80b8c7" stroke-width="0.4" opacity="0.25"/>
    </pattern>
    <g id="panel">
      <rect x="1" y="3" width="78" height="48" rx="3" fill="#142e3b" opacity="0.4"/>
      <rect width="78" height="48" rx="2" fill="#b6d1ce"/>
      <rect x="3" y="3" width="72" height="42" rx="1" fill="url(#glass)"/>
      <rect x="3" y="3" width="72" height="42" fill="url(#cells)"/>
      <path d="M4 4H73L4 33Z" fill="#e2ffff" opacity="0.09"/>
    </g>
    <g id="bush">
      <path d="M-29 0C-45-13-32-37-16-32C-17-54 17-57 22-34C44-39 53-9 31 0Z" fill="#658c68"/>
      <path d="M0 0V-31M0-13L-15-24M0-6L19-24" stroke="#426b52" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="900" height="900" fill="#f9f6ec"/>
  <circle cx="450" cy="436" r="330" fill="url(#sky)"/>
  <circle cx="450" cy="436" r="329" fill="none" stroke="#d7e3da"/>

  <!-- An elliptical solar orbit, with a soft dotted continuation. -->
  <path d="M165 265C268 107 649 113 759 319C866 519 644 729 386 712C119 695 32 469 165 265Z" fill="none" stroke="#dccda6" stroke-width="2" stroke-dasharray="5 10" stroke-linecap="round"/>
  <path d="M165 265C223 176 369 137 510 159" fill="none" stroke="#d4b66d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M501 151L512 159L499 164" fill="none" stroke="#d4b66d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Airy clouds. -->
  <g fill="#fffdf6" opacity="0.9">
    <path d="M234 260C215 260 215 242 231 239C228 216 261 211 269 231C287 223 301 236 297 249C315 250 312 260 302 260Z"/>
    <path d="M639 233C623 233 622 220 635 217C635 199 658 192 668 210C683 204 697 215 693 225C710 225 710 235 697 235Z"/>
  </g>

  <!-- Ground and garden. -->
  <ellipse cx="462" cy="662" rx="275" ry="66" fill="#d6debd"/>
  <ellipse cx="469" cy="664" rx="239" ry="42" fill="#b6c6a0" opacity="0.48"/>
  <path d="M421 650L470 650L520 721Q492 730 461 728Z" fill="#f5eedb"/>
  <path d="M440 680L490 678M451 703L507 700" stroke="#ddd5bf" stroke-width="2"/>

  <!-- A small tree peeks out from behind the house. -->
  <path d="M705 619V501M705 543L681 518M705 561L732 531" stroke="#8e8160" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M666 547C638 535 645 504 661 494C644 470 663 443 689 446C703 417 741 429 746 452C775 454 781 489 764 505C785 533 752 562 732 548C711 565 686 562 666 547Z" fill="#75976a"/>
  <path d="M704 539V474M704 506L681 490M704 525L733 494" stroke="#557c5c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <use href="#bush" transform="translate(233 632) scale(1.05)"/>

  <!-- Walls and deep foundation. -->
  <path d="M245 447H520V654H245Z" fill="#fff4d9"/>
  <path d="M520 447L638 304L706 414V586L520 654Z" fill="#e5d7b5"/>
  <path d="M245 642H520V656H245Z" fill="#d1bc93"/>
  <path d="M520 642L706 575V588L520 656Z" fill="#b6aa87"/>
  <path d="M246 451H520V465H246Z" fill="#cfbc96" opacity="0.6"/>
  <path d="M520 447L638 304L706 414V430L637 328L528 464Z" fill="#b7a586" opacity="0.5"/>
  <g stroke="#d2c49f" stroke-width="1.5" opacity="0.65">
    <path d="M534 480L693 423M534 508L693 451M534 536L693 479M534 564L693 507M534 592L693 535M534 620L693 563"/>
  </g>

  <!-- Terracotta roof with a broad, sun-facing solar array. -->
  <path d="M224 447L342 291H641L521 447Z" fill="#b87350"/>
  <path d="M237 436L346 302H623L517 436Z" fill="#c88760"/>
  <g fill="none" stroke="#aa684c" stroke-width="1.5" opacity="0.48">
    <path d="M255 414H534M273 390H552M291 366H570M309 342H588M327 318H606"/>
    <path d="M385 302L280 436M429 302L324 436M473 302L368 436M517 302L412 436M561 302L456 436M605 302L500 436"/>
  </g>
  <path d="M224 447H521V457H224Z" fill="#805644"/>
  <path d="M521 447L641 291L717 414L705 420L640 314L531 457Z" fill="#885c46"/>
  <path d="M342 291H641" stroke="#e0a17a" stroke-width="6" stroke-linecap="round"/>

  <!-- The array uses a shared skew so every cell sits on the roof plane. -->
  <g transform="matrix(1 0 -0.76 1 345 317)">
    <use href="#panel"/>
    <use href="#panel" x="85"/>
    <use href="#panel" x="170"/>
    <use href="#panel" y="55"/>
    <use href="#panel" x="85" y="55"/>
    <use href="#panel" x="170" y="55"/>
    <path d="M7 7H239" stroke="#efffff" stroke-width="2" opacity="0.55">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Front window, door, and a little porch light. -->
  <rect x="276" y="492" width="106" height="98" rx="3" fill="#d9c7a3"/>
  <rect x="280" y="491" width="98" height="91" rx="2" fill="#fffcf0"/>
  <rect x="287" y="498" width="84" height="77" fill="url(#window)"/>
  <path d="M290 501H342L290 552Z" fill="#d7efde" opacity="0.35"/>
  <path d="M329 497V577M286 537H372" stroke="#fff9e7" stroke-width="6"/>
  <rect x="272" y="579" width="114" height="9" rx="2" fill="#bfa681"/>
  <rect x="412" y="500" width="66" height="145" rx="3" fill="#cfbc95"/>
  <rect x="419" y="506" width="54" height="137" rx="2" fill="#53776b"/>
  <rect x="426" y="515" width="40" height="45" rx="2" fill="#b9d3c3"/>
  <path d="M430 519H457L430 550Z" fill="#e8f4db" opacity="0.5"/>
  <path d="M427 577H465V632H427Z" fill="none" stroke="#729385" stroke-width="2"/>
  <circle cx="462" cy="574" r="3.5" fill="#edcb77"/>
  <path d="M407 644H484V653H407Z" fill="#e6d9bb"/>
  <path d="M402 653H489V662H402Z" fill="#f8eed5"/>
  <path d="M493 501V511" stroke="#746c53" stroke-width="3"/>
  <rect x="487" y="510" width="12" height="19" rx="4" fill="#7b7960"/>
  <rect x="490" y="513" width="6" height="11" rx="2" fill="#ffdfa0"/>

  <!-- Side window and round attic vent. -->
  <path d="M572 482L646 455V534L572 561Z" fill="#ae9f7e"/>
  <path d="M578 486L640 464V530L578 552Z" fill="url(#window)"/>
  <path d="M609 475V541M577 518L641 495" stroke="#faf0d7" stroke-width="5"/>
  <path d="M568 559L650 529V538L568 568Z" fill="#f7e9cc"/>
  <ellipse cx="635" cy="388" rx="18" ry="23" transform="rotate(19 635 388)" fill="#aa9979"/>
  <ellipse cx="635" cy="388" rx="12" ry="17" transform="rotate(19 635 388)" fill="#587969"/>
  <path d="M625 383L647 378M623 391L643 386M623 399L640 394" stroke="#c5c3a0" stroke-width="2"/>

  <!-- Garden planting and small flowers. -->
  <use href="#bush" transform="translate(295 655) scale(0.68)"/>
  <use href="#bush" transform="translate(341 660) scale(0.86)"/>
  <use href="#bush" transform="translate(674 617) scale(0.87)"/>
  <use href="#bush" transform="translate(626 636) scale(0.6)"/>
  <g stroke="#789060" stroke-width="2" stroke-linecap="round">
    <path d="M239 674V657M252 679V664M591 675V657M605 669V650"/>
  </g>
  <g fill="#e2aa50">
    <circle cx="239" cy="655" r="4"/><circle cx="252" cy="662" r="3.5"/>
    <circle cx="591" cy="655" r="4"/><circle cx="605" cy="648" r="3.5"/>
  </g>
  <g fill="none" stroke="#8fa67a" stroke-width="2" stroke-linecap="round">
    <path d="M205 646L201 639M205 646L210 637M718 648L720 638M718 648L712 642M357 695L353 688M357 695L363 688"/>
  </g>

  <!-- The sun follows the complete orbit; its rays rotate independently. -->
  <g>
    <animateMotion dur="20s" repeatCount="indefinite" calcMode="paced" path="M165 265C268 107 649 113 759 319C866 519 644 729 386 712C119 695 32 469 165 265Z"/>
    <circle r="84" fill="url(#sunGlow)"/>
    <g stroke="#e8b444" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <path d="M0-49V-58M0 49V58M49 0H58M-49 0H-58M34.65-34.65L41-41M-34.65 34.65L-41 41M34.65 34.65L41 41M-34.65-34.65L-41-41M18.75-45.27L22.2-53.58M-18.75 45.27L-22.2 53.58M45.27 18.75L53.58 22.2M-45.27-18.75L-53.58-22.2M45.27-18.75L53.58-22.2M-45.27 18.75L-53.58 22.2M18.75 45.27L22.2 53.58M-18.75-45.27L-22.2-53.58"/>
    </g>
    <circle r="37" fill="#f4be4f"/>
    <circle cx="-3" cy="-4" r="31" fill="#ffd66d"/>
    <path d="M-23-10A25 25 0 0 1-8-25" fill="none" stroke="#ffebaa" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Quiet typographic signature under the illustration. -->
  <g text-anchor="middle" fill="#426256" font-family="sans-serif">
    <text x="450" y="799" font-size="15" font-weight="600" letter-spacing="5">POWERED BY SUNSHINE</text>
    <text x="450" y="825" font-size="12" letter-spacing="2" fill="#8b967c">A BRIGHTER KIND OF HOME</text>
  </g>
</svg>