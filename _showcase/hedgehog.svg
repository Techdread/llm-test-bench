<circle cx="283" cy="360" r="4.5" fill="#fce5d3"/>
<circle cx="274" cy="364" r="4.5" fill="#fce5d3"/>
<circle cx="265" cy="360" r="4.5" fill="#fce5d3"/>
<!-- Soft toe pads -->
<ellipse cx="274" cy="354" rx="5" ry="3.5" fill="#efa594" opacity="0.4"/>
<path d="M 285 363 Q 286 366 285 367" stroke="#b07d58" stroke-width="1.2" stroke-linecap="round" fill="none"/>
<path d="M 274 367 Q 274 370 273 370" stroke="#b07d58" stroke-width="1.2" stroke-linecap="round" fill="none"/>
<path d="M 263 363 Q 262 366 263 367" stroke="#b07d58" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</g>
