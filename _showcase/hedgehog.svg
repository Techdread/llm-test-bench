<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
<defs>
<!-- Soft Drop Shadow -->
<radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
<stop offset="0%" stop-color="#4a2c11" stop-opacity="0.35"/>
<stop offset="60%" stop-color="#6e4522" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#6e4522" stop-opacity="0"/>
</radialGradient>
<!-- Quill Gradients -->
<linearGradient id="quill-dark" x1="0%" y1="100%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#3b200c"/>
<stop offset="70%" stop-color="#5a3418"/>
<stop offset="100%" stop-color="#8c5832"/>
</linearGradient>
<linearGradient id="quill-mid" x1="0%" y1="100%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#4e2b13"/>
<stop offset="60%" stop-color="#7c4a24"/>
<stop offset="90%" stop-color="#b67d4f"/>
<stop offset="100%" stop-color="#e8c49e"/>
</linearGradient>
<linearGradient id="quill-light" x1="0%" y1="100%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#633919"/>
<stop offset="50%" stop-color="#9a6236"/>
<stop offset="85%" stop-color="#d49d6a"/>
<stop offset="100%" stop-color="#f5deb8"/>
</linearGradient>
<linearGradient id="quill-highlight" x1="0%" y1="100%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#7a4620"/>
<stop offset="60%" stop-color="#b87b48"/>
<stop offset="85%" stop-color="#e2b484"/>
<stop offset="100%" stop-color="#fff0db"/>
</linearGradient>
<!-- Body & Face Gradient -->
<radialGradient id="body-grad" cx="45%" cy="40%" r="55%">
<stop offset="0%" stop-color="#fff2e5"/>
<stop offset="45%" stop-color="#f7dcbf"/>
<stop offset="80%" stop-color="#e0b68d"/>
<stop offset="100%" stop-color="#c49364"/>
</radialGradient>
<radialGradient id="face-grad" cx="50%" cy="45%" r="50%">
<stop offset="0%" stop-color="#fff6ed"/>
<stop offset="60%" stop-color="#fce2ca"/>
<stop offset="100%" stop-color="#ecc099"/>
</radialGradient>
<!-- Paw Gradient -->
<linearGradient id="paw-grad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#fae3d0"/>
<stop offset="70%" stop-color="#eec3a4"/>
<stop offset="100%" stop-color="#d89f78"/>
</linearGradient>
<!-- Ear Blush & Cheek Blush -->
<radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#f58b76" stop-opacity="0.6"/>
<stop offset="60%" stop-color="#f7a192" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#f7a192" stop-opacity="0"/>
</radialGradient>
<!-- Eye Gradient -->
<radialGradient id="eye-grad" cx="35%" cy="30%" r="65%">
<stop offset="0%" stop-color="#3d2010"/>
<stop offset="60%" stop-color="#1f0e05"/>
<stop offset="100%" stop-color="#0a0401"/>
</radialGradient>
<!-- Nose Gradient -->
<linearGradient id="nose-grad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#4a2511"/>
<stop offset="70%" stop-color="#271105"/>
<stop offset="100%" stop-color="#140701"/>
</linearGradient>
</defs>
<!-- Ground Shadow -->
<ellipse cx="250" cy="435" rx="145" ry="22" fill="url(#ground-shadow)"/>
