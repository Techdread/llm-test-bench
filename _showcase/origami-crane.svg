<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amber1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#E87D0A"/>
    </linearGradient>
    <linearGradient id="amber2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB833"/>
      <stop offset="100%" stop-color="#D65A05"/>
    </linearGradient>
    <linearGradient id="amber3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF991F"/>
      <stop offset="100%" stop-color="#B84A00"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="50%" stop-color="#444"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF8C00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0B1120"/>

  <g id="left-wing" transform="translate(400, 400)" filter="url(#glassGlow)">
    <!-- Forewing Cells -->
    <path d="M 0,-20 L -90,-70 L -190,-160 L -280,-190 L -300,-160 L -210,-100 L -100,-50 Z" fill="url(#amber1)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -100,-50 L -210,-100 L -300,-160 L -330,-100 L -310,-40 L -200,0 Z" fill="url(#amber2)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -200,0 L -310,-40 L -330,-100 L -350,-30 L -340,30 L -260,50 L -180,40 Z" fill="url(#amber3)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 0,-20 L -100,-50 L -180,40 L -260,50 L -340,30 L -280,80 L -200,110 L -120,80 L -60,40 Z" fill="url(#amber1)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -60,40 L -120,80 L -200,110 L -160,140 L -90,120 L -40,80 Z" fill="url(#amber2)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -350,-30 L -390,20 L -370,80 L -340,30 Z" fill="url(#amber3)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -260,50 L -280,80 L -240,120 L -180,110 Z" fill="url(#amber1)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>

    <!-- Forewing Border Spots -->
    <polygon points="-300,-160 -290,-175 -275,-165" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-330,-100 -320,-118 -305,-105" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-350,-30 -340,-50 -325,-40" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-390,20 -385,40 -365,35" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-370,80 -360,95 -340,85" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-240,120 -225,135 -210,115" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-160,140 -145,155 -130,135" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-90,120 -75,135 -60,115" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>

    <!-- Hindwing Cells -->
    <path d="M -10,40 L -90,60 L -170,110 L -240,180 L -210,240 L -130,270 L -60,240 L -20,200 L 10,150 Z" fill="url(#amber2)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -170,110 L -260,140 L -310,200 L -240,180 Z" fill="url(#amber1)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -240,180 L -310,200 L -300,260 L -270,290 L -210,240 Z" fill="url(#amber3)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -60,240 L -130,270 L -160,310 L -100,330 L -40,300 L -20,200 Z" fill="url(#amber1)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -20,200 L -40,300 L -10,340 L 20,320 L 30,260 L 20,200 Z" fill="url(#amber2)" stroke="#0A0A0A" stroke-width="6" stroke-linejoin="round"/>

    <!-- Hindwing Border Spots -->
    <polygon points="-310,200 -300,220 -285,205" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-300,260 -285,280 -270,260" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-270,290 -250,305 -240,285" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-160,310 -145,325 -130,300" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-100,330 -85,345 -70,320" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-40,300 -25,315 -10,290" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <polygon points="-20,200 -5,180 5,200" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  </g>

  <!-- Right Wing Mirrored -->
  <use href="#left-wing" transform="translate(800, 0) scale(-1, 1)"/>

  <!-- Center Body & Antennae -->
  <g id="monarch-body">
    <!-- Antennae -->
    <path d="M 385,280 C 375,230 335,170 305,140" fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
    <path d="M 415,280 C 425,230 465,170 495,140" fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
    <!-- Antennae Clubs -->
    <circle cx="305" cy="140" r="8" fill="#0A0A0A"/>
    <circle cx="495" cy="140" r="8" fill="#0A0A0A"/>
    
    <!-- Head -->
    <ellipse cx="400" cy="280" rx="18" ry="20" fill="url(#bodyGrad)"/>
    
    <!-- Thorax -->
    <ellipse cx="400" cy="350" rx="22" ry="45" fill="url(#bodyGrad)"/>
    <path d="M 382,310 L 418,310 M 378,380 L 422,380" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Abdomen -->
    <path d="M 388,410 C 405,460 412,520 400,570 C 388,520 395,460 412,410 Z" fill="url(#bodyGrad)"/>
    <path d="M 385,440 L 415,445 M 388,475 L 412,475 M 390,510 L 410,510 M 392,540 L 408,540" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Decorative Stained Glass Outer Glow/Lead Accents -->
  <rect width="100%" height="100%" fill="none" stroke="#FF9D00" stroke-width="4" stroke-dasharray="12 18" opacity="0.15"/>
</svg>