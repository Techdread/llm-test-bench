<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="55%" stop-color="#232329"/>
      <stop offset="100%" stop-color="#111114"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="45%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c44"/>
      <stop offset="18%" stop-color="#2b2b31"/>
      <stop offset="100%" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d574"/>
      <stop offset="45%" stop-color="#c9962e"/>
      <stop offset="100%" stop-color="#7a5614"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d4d56"/>
      <stop offset="12%" stop-color="#3a3a42"/>
      <stop offset="55%" stop-color="#24242a"/>
      <stop offset="100%" stop-color="#0c0c0f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="35%" stop-color="#9a9aa3"/>
      <stop offset="55%" stop-color="#c9c9d0"/>
      <stop offset="75%" stop-color="#77777f"/>
      <stop offset="100%" stop-color="#1f1f24"/>
    </linearGradient>
    <radialGradient id="rim" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#74747c"/>
      <stop offset="40%" stop-color="#45454b"/>
      <stop offset="72%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="top" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f1e9"/>
      <stop offset="82%" stop-color="#d8d8cc"/>
      <stop offset="100%" stop-color="#b9b9ac"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.62"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- platen -->
  <rect x="42" y="6" width="716" height="96" rx="10" fill="#141418"/>
  <rect x="46" y="10" width="708" height="36" rx="18" fill="#2c2c33"/>
  <rect x="60" y="14" width="680" height="8" rx="4" fill="#4a4a54" opacity="0.8"/>
  <rect x="42" y="86" width="716" height="16" rx="8" fill="#050507"/>
  <rect x="120" y="14" width="5" height="82" fill="#000000" opacity="0.25"/>
  <rect x="675" y="14" width="5" height="82" fill="#000000" opacity="0.25"/>

  <!-- brass trim -->
  <rect x="40" y="284" width="720" height="16" fill="url(#brass)"/>
  <rect x="40" y="284" width="720" height="3" fill="#f8e39a" opacity="0.85"/>
  <rect x="40" y="297" width="720" height="3" fill="#4d370c" opacity="0.9"/>

  <!-- machine plate -->
  <rect x="20" y="300" width="760" height="200" fill="url(#plate)"/>
  <rect x="20" y="300" width="760" height="2" fill="#000000" opacity="0.5"/>

  <!-- hint of adjacent keys -->
  <circle cx="16" cy="362" r="52" fill="#101014"/>
  <circle cx="784" cy="362" r="52" fill="#101014"/>

  <!-- stems -->
  <rect x="151" y="308" width="18" height="104" rx="6" fill="url(#stem)"/>
  <rect x="311" y="308" width="18" height="104" rx="6" fill="url(#stem)"/>
  <rect x="471" y="308" width="18" height="104" rx="6" fill="url(#stem)"/>
  <rect x="631" y="308" width="18" height="104" rx="6" fill="url(#stem)"/>

  <!-- soft key shadows -->
  <ellipse cx="168" cy="438" rx="64" ry="15" fill="url(#shad)"/>
  <ellipse cx="328" cy="438" rx="64" ry="15" fill="url(#shad)"/>
  <ellipse cx="488" cy="438" rx="64" ry="15" fill="url(#shad)"/>
  <ellipse cx="648" cy="438" rx="64" ry="15" fill="url(#shad)"/>

  <!-- key A -->
  <circle cx="160" cy="362" r="78" fill="url(#rim)"/>
  <path d="M 115 323 A 62 62 0 0 1 205 323" fill="none" stroke="#8b8b94" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="160" cy="362" r="60" fill="url(#top)"/>
  <circle cx="160" cy="362" r="60" fill="none" stroke="#000000" stroke-opacity="0.12"/>
  <ellipse cx="141" cy="338" rx="24" ry="15" fill="url(#spot)" opacity="0.55"/>
  <text x="160" y="370" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold" text-anchor="middle" fill="#21211e">A</text>

  <!-- key S -->
  <circle cx="320" cy="362" r="78" fill="url(#rim)"/>
  <path d="M 275 323 A 62 62 0 0 1 365 323" fill="none" stroke="#8b8b94" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="320" cy="362" r="60" fill="url(#top)"/>
  <circle cx="320" cy="362" r="60" fill="none" stroke="#000000" stroke-opacity="0.12"/>
  <ellipse cx="301" cy="338" rx="24" ry="15" fill="url(#spot)" opacity="0.55"/>
  <text x="320" y="370" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold" text-anchor="middle" fill="#21211e">S</text>

  <!-- key D -->
  <circle cx="480" cy="362" r="78" fill="url(#rim)"/>
  <path d="M 435 323 A 62 62 0 0 1 525 323" fill="none" stroke="#8b8b94" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="480" cy="362" r="60" fill="url(#top)"/>
  <circle cx="480" cy="362" r="60" fill="none" stroke="#000000" stroke-opacity="0.12"/>
  <ellipse cx="461" cy="338" rx="24" ry="15" fill="url(#spot)" opacity="0.55"/>
  <text x="480" y="370" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold" text-anchor="middle" fill="#21211e">D</text>

  <!-- key F -->
  <circle cx="640" cy="362" r="78" fill="url(#rim)"/>
  <path d="M 595 323 A 62 62 0 0 1 685 323" fill="none" stroke="#8b8b94" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="640" cy="362" r="60" fill="url(#top)"/>
  <circle cx="640" cy="362" r="60" fill="none" stroke="#000000" stroke-opacity="0.12"/>
  <ellipse cx="621" cy="338" rx="24" ry="15" fill="url(#spot)" opacity="0.55"/>
  <text x="640" y="370" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold" text-anchor="middle" fill="#21211e">F</text>

  <rect width="800" height="500" fill="url(#vign)"/>
</svg>